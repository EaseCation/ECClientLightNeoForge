plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.test)

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = project.file("run/${name}")
        }
        client {
            client()
            if (providers.gradleProperty('quickPlaySingleplayer').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('quickPlaySingleplayer').get()
            }
            if (providers.gradleProperty('quickPlayMultiplayer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('quickPlayMultiplayer').get()
            }
            if (providers.gradleProperty('mixinDebugExport').isPresent()) {
                systemProperty 'mixin.debug.export', 'true'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
